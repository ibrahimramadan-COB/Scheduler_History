name: WebPT Scheduler History Scrape

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (MM/DD/YYYY)"
        required: true
      end_date:
        description: "End date (MM/DD/YYYY)"
        required: true
      clinics:
        description: "Only scrape these clinics (pipe-separated, e.g. Allerton|Astoria). Blank = all clinics."
        required: false
        default: ""
      clinic_limit:
        description: "DEBUG ONLY: only process the first N clinics (blank = all)"
        required: false
        default: ""
      max_retries:
        description: "DEBUG ONLY: retries per clinic (blank = default 6)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        id: scrape
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          WEBPT_USERNAME: ${{ secrets.WEBPT_USERNAME }}
          WEBPT_PASSWORD: ${{ secrets.WEBPT_PASSWORD }}
          CLINIC_NAMES: ${{ inputs.clinics }}
          CLINIC_LIMIT: ${{ inputs.clinic_limit }}
          MAX_RETRIES: ${{ inputs.max_retries }}
        run: python scripts/scraper.py

      - name: Clean + load to Snowflake
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          RAW_FILE: ${{ steps.scrape.outputs.raw_file }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: python scripts/snowflake_writer.py

      - name: Compute safe artifact name
        id: names
        run: |
          SAFE_START=$(echo "${{ inputs.start_date }}" | tr '/' '-')
          SAFE_END=$(echo "${{ inputs.end_date }}" | tr '/' '-')
          echo "safe_range=${SAFE_START}_to_${SAFE_END}" >> "$GITHUB_OUTPUT"

      - name: Upload raw output as a workflow artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webpt-scheduler-history-${{ steps.names.outputs.safe_range }}
          path: output/raw/*.xlsx
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload debug diagnostics (page HTML/screenshots on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-diagnostics-${{ github.run_id }}
          path: output/debug/*
          retention-days: 14
          if-no-files-found: ignore
